name: Build Check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    # ready_for_review makes the full build start when a draft is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  # Direct pushes to main (small maintainer changes) get the same build.
  # Docs-only and bookkeeping pushes are skipped. This filter is on push only,
  # so it never affects the required checks on pull requests.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'Appcasts/**'
      - 'appcast.xml'
      - 'oecores.xml'
      - 'Casks/**'
      - 'Releases/**'
      - '.claude/**'
      - '.cursor/**'

# Cancel a PR's in-flight run when a newer commit is pushed to it. Pushes to
# main are keyed by commit, so they are never cancelled by a later push.
concurrency:
  group: build-check-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-sources:
    # Fast guard (no Xcode): catches a flattened core submodule that was
    # committed without its vendored upstream source — the regression that
    # silently broke the Dolphin build for months because CI never compiled it.
    # Covers every core's .gitmodules, not a hardcoded list.
    # Runs on every PR; it takes seconds and needs no build toolchain.
    name: Core sources present
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Check vendored core externals are populated
        run: ./Scripts/check-core-sources.sh

      - name: Test vendored core externals check
        run: python3 Scripts/test-check-core-sources.py

      - name: Test core change detection
        run: python3 Scripts/test-detect-core-changes.py

      # No upstream update URLs in core plists, every SUFeedURL has an Appcasts/ file,
      # every core plist has a SUFeedURL. Seconds; no toolchain needed.
      - name: Check core update feed URLs
        run: ./Scripts/check-core-feed-urls.sh

  detect-core-changes:
    # The `OpenEmu` scheme only builds the main app plus its own dependencies
    # (OpenEmuKit/Base/System) — it never compiles core plugins, so a PR that
    # only touches a core could go green without a single changed line being
    # built. Figure out which cores (if any) actually need building for this
    # PR, so the core matrix below only runs what changed.
    name: Detect changed cores
    # Draft PRs skip the macOS builds; marking one ready for review starts them.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      cores: ${{ steps.detect.outputs.cores }}
      fbneo: ${{ steps.detect.outputs.fbneo }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 0

      - name: Determine which core schemes to build
        id: detect
        run: |
          # Most cores build through the "OpenEmu + <Name>" combined scheme.
          # DeSmuME and Dolphin only have a bare "<Name>" scheme — the Build
          # step below picks the right one per core. MAME also has a bare
          # scheme but isn't listed here: its build is currently broken
          # (missing deps/mame/src/osd/headless/public headers) and its
          # deps/mame source is deliberately not vendored into this repo
          # (see MAME/README.md) — it needs its own clone-and-build CI job,
          # not a slot in this xcodebuild matrix. Tracked separately.
          all_cores='["4DO","Atari800","Bliss","BSNES","CrabEmu","DeSmuME","Dolphin","FCEU","Flycast","Gambatte","GenesisPlus","JollyCV","Mednafen","mGBA","Mupen64Plus","Nestopia","O2EM","Picodrive","PokeMini","Potator","PPSSPP","ProSystem","SNES9x","Stella","VecXGL","VirtualJaguar","blueMSX"]'

          # A couple of core scheme names don't match their top-level
          # directory name, so the plain "did <core>/ change" check below
          # needs an explicit override for them. (Not a bash associative
          # array — macOS's default /bin/bash is 3.2 and doesn't have them.)
          core_dirs_json='{"Potator":"Potator-Core","Picodrive":"picodrive"}'

          # Work out what to diff against: the PR base for a pull request, or the
          # previous tip of main for a direct push. Anything else (manual run,
          # first push, missing history) builds everything.
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
          fi

          # FBNeo builds via its own clone-and-build script (its deps/fbneo source
          # isn't vendored and it's not a slot in the xcodebuild matrix — same
          # situation as MAME). Track it with a separate flag.
          fbneo=false

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable diff base (event: ${{ github.event_name }}) - building all core schemes"
            cores="$all_cores"
            fbneo=true
          else
            # --no-renames lists both the old and new path of a move; quotePath=false
            # keeps non-ASCII file names readable instead of octal-escaped.
            changed=$(git -c core.quotePath=false diff --no-renames --name-only "$base" "${{ github.sha }}")
            echo "Changed files:"
            echo "$changed"

            # A change to shared framework code, the workspace, or scheme files
            # can affect every core's build — fall back to building all of them.
            # Scripts/ is deliberately not on this list: no Xcode project,
            # scheme, or build phase references it, so a script change cannot
            # change what a core compiles. (If a build phase ever starts
            # calling a script, add that script's path here.)
            # OpenEmuKit/ is not on this list: about 19 cores compile .m files or
            # import headers directly out of OpenEmuKit/Source/, but no core
            # compiles its Swift, imports its Swift header, or links the
            # framework. Scripts/detect-core-changes.py picks the affected cores
            # from the cores' Xcode projects (see below).
            if echo "$changed" | grep -qE '^(OpenEmu-SDK/|OpenEmu-metal\.xcworkspace/)'; then
              echo "Shared code changed — building all core schemes"
              cores="$all_cores"
            else
              cores=$(CHANGED_FILES="$changed" ALL_CORES="$all_cores" CORE_DIRS="$core_dirs_json" python3 -c "
          import json, os
          all_cores = json.loads(os.environ['ALL_CORES'])
          core_dirs = json.loads(os.environ['CORE_DIRS'])
          changed = os.environ['CHANGED_FILES'].splitlines()
          selected = [c for c in all_cores if any(f.startswith(core_dirs.get(c, c) + '/') for f in changed)]
          print(json.dumps(selected))
          ")
            fi

            # A change under OpenEmuKit/ adds the cores Scripts/detect-core-changes.py
            # picks (a Swift or doc file picks none; a C-family file a core's
            # project uses picks that core; anything unrecognised picks every
            # core). If the script fails, build every core.
            if echo "$changed" | grep -q '^OpenEmuKit/'; then
              if kit_cores=$(echo "$changed" | python3 Scripts/detect-core-changes.py --files - | python3 -c "import json, sys; print(json.dumps(json.load(sys.stdin)['cores']))"); then
                cores=$(KIT_CORES="$kit_cores" CORES="$cores" python3 -c "
          import json, os
          print(json.dumps(sorted(set(json.loads(os.environ['CORES'])) | set(json.loads(os.environ['KIT_CORES'])))))
          ")
              else
                echo "detect-core-changes.py failed - building all core schemes"
                cores="$all_cores"
              fi
            fi
            echo "--- building: $cores ---"

            # FBNeo depends on FBNeo/ plus the frameworks it links (OpenEmu-SDK /
            # OpenEmuBase) and compiles from (OpenEmuKit/Source: the RA bridge).
            # Only a non-Swift, non-doc OpenEmuKit file can reach it.
            if echo "$changed" | grep -qE '^(FBNeo/|Scripts/(prepare|build)-fbneo-core\.sh|OpenEmu-SDK/)' \
               || echo "$changed" | grep -E '^OpenEmuKit/' | grep -qvE '\.(swift|md|txt)$'; then
              fbneo=true
            fi
          fi

          echo "Core schemes to build: $cores"
          echo "cores=$cores" >> "$GITHUB_OUTPUT"
          echo "Build FBNeo: $fbneo"
          echo "fbneo=$fbneo" >> "$GITHUB_OUTPUT"

  build-cores:
    name: Build core (${{ matrix.core }})
    needs: detect-core-changes
    if: needs.detect-core-changes.outputs.cores != '[]'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      # Cap parallel macOS runners so a full-matrix run does not exhaust
      # runner capacity (the rest queue and start as slots free up).
      max-parallel: 8
      matrix:
        core: ${{ fromJson(needs.detect-core-changes.outputs.cores) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1.6.0
        with:
          xcode-version: latest-stable

      - name: Clear SPM binary artifact cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts/

      - name: Generate credentials stubs
        run: |
          cp OpenEmu/ScreenScraperDevCredentials.template.swift OpenEmu/ScreenScraperDevCredentials.swift
          cp OpenEmu/CheatWorksSecrets.template.swift OpenEmu/CheatWorksSecrets.swift

      - name: Build ${{ matrix.core }} (arm64)
        run: |
          # Mednafen, SNES9x, and mGBA guard against Debug builds with a
          # #error ("Cores should not be compiled in DEBUG!") — they must
          # be built Release, unlike every other core in this matrix.
          case "${{ matrix.core }}" in
            Mednafen|SNES9x|mGBA) configuration=Release ;;
            *) configuration=Debug ;;
          esac

          # Most cores build through the "OpenEmu + <Name>" combined scheme.
          # DeSmuME and Dolphin only have a bare "<Name>" scheme.
          case "${{ matrix.core }}" in
            DeSmuME|Dolphin) scheme="${{ matrix.core }}" ;;
            *) scheme="OpenEmu + ${{ matrix.core }}" ;;
          esac

          xcodebuild build \
            -workspace OpenEmu-metal.xcworkspace \
            -scheme "$scheme" \
            -configuration "$configuration" \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  build-fbneo:
    # FBNeo isn't a slot in the core matrix above: its deps/fbneo source isn't
    # vendored (pulled from the OpenEmu-Silicon/fbneo fork at a pinned revision)
    # and it builds the headless engine + plugin through its own script. Same
    # clone-and-build shape MAME needs. Only runs when FBNeo-relevant files change.
    name: Build FBNeo core
    needs: detect-core-changes
    if: needs.detect-core-changes.outputs.fbneo == 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1.6.0
        with:
          xcode-version: latest-stable

      - name: Clear SPM binary artifact cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts/

      - name: Generate credentials stubs
        run: |
          cp OpenEmu/ScreenScraperDevCredentials.template.swift OpenEmu/ScreenScraperDevCredentials.swift
          cp OpenEmu/CheatWorksSecrets.template.swift OpenEmu/CheatWorksSecrets.swift

      - name: Build FBNeo (clone pinned fork, build dylib + plugin)
        run: |
          # build-fbneo-core.sh runs prepare-fbneo-core.sh (clones the pinned
          # fork revision into FBNeo/deps/fbneo), builds fbneo_headless.dylib,
          # then OpenEmuBase + FBNeo.oecoreplugin (adhoc-signed, no identity needed).
          ./Scripts/build-fbneo-core.sh

  build:
    name: Build (arm64)
    # Draft PRs skip the macOS builds; marking one ready for review starts them.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1.6.0
        with:
          xcode-version: latest-stable

      - name: Clear SPM binary artifact cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts/

      - name: Generate credentials stubs
        run: |
          cp OpenEmu/ScreenScraperDevCredentials.template.swift OpenEmu/ScreenScraperDevCredentials.swift
          cp OpenEmu/CheatWorksSecrets.template.swift OpenEmu/CheatWorksSecrets.swift

      - name: Test DualSense Bluetooth report decoding
        run: |
          xcrun clang -std=c11 -UNDEBUG -Wall -Wextra -Werror -fsanitize=address,undefined \
            OpenEmu-SDK/OpenEmuSystemTests/OEDualSenseBluetoothReportTests.c \
            -lz -o "$RUNNER_TEMP/dualsense-report-tests"
          "$RUNNER_TEMP/dualsense-report-tests"

      - name: Build OpenEmu (Debug, arm64)
        run: |
          xcodebuild build \
            -workspace OpenEmu-metal.xcworkspace \
            -scheme OpenEmu \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run OpenEmuBaseTests (incl. RA hardcore regression suite)
        run: |
          xcodebuild test \
            -project OpenEmu-SDK/OpenEmu-SDK.xcodeproj \
            -scheme OpenEmuBase \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  # The two jobs below are new and kept apart from `build` on purpose: they are not required checks until the
  # maintainer adds them to branch protection, so a flaky runner cannot block pull requests while they prove themselves.

  app-unit-tests:
    name: App unit tests (OpenEmuTests)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1.6.0
        with:
          xcode-version: latest-stable

      - name: Clear SPM binary artifact cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts/

      - name: Generate credentials stubs
        run: |
          cp OpenEmu/ScreenScraperDevCredentials.template.swift OpenEmu/ScreenScraperDevCredentials.swift
          cp OpenEmu/CheatWorksSecrets.template.swift OpenEmu/CheatWorksSecrets.swift

      - name: Download the game database
        # GameInfoHelperTests and ImportFailureTests read openvgdb.sqlite, which the app downloads into the user's
        # Application Support folder on first run. A fresh runner does not have it, so those tests would skip.
        # A fixed release, so the tests see the same data every run.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/Library/Application Support/OpenEmu"
          gh release download v29.0 --repo OpenVGDB/OpenVGDB --pattern openvgdb.zip --dir "$RUNNER_TEMP"
          unzip -o "$RUNNER_TEMP/openvgdb.zip" -d "$HOME/Library/Application Support/OpenEmu"
          ls -l "$HOME/Library/Application Support/OpenEmu/openvgdb.sqlite"

      - name: Run OpenEmuTests
        # The app is the test host and starts with no library; tests that need one make a throwaway
        # library themselves (ensureTestLibrary in ROMImporterTests). A test that hangs fails after 2 minutes.
        run: |
          xcodebuild test \
            -workspace OpenEmu-metal.xcworkspace \
            -scheme OpenEmu \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 120 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  headless-gameboy:
    # Runs the Gambatte core with no window against a small test ROM written for this repo:
    # loads, draws, takes button presses, and round-trips save states. See Scripts/headless/.
    name: Headless core checks (Game Boy)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@1242409711ff5721add51979e9e11e23ebb7e5a4 # v1.6.0
        with:
          xcode-version: latest-stable

      - name: Clear SPM binary artifact cache
        run: rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts/

      - name: Run headless Game Boy checks
        run: ./Scripts/headless/gb-checks.sh
